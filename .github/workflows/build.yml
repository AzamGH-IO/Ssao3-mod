name: Build SSAO
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dapatkan header AML
        run: |
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader aml_src
          mkdir -p include/aml
          cp -r aml_src/mod/* include/aml/
      - name: Kompil arm64-v8a
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - uses: actions/upload-artifact@v4
        with:
          name: libSSAO
          path: build/libSSAO.so
